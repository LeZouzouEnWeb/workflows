# Exemple d'utilisation du workflow de vérification PR vers PROD
# Ce workflow autorise les PR provenant de develop ou homol vers main

name: 🔒 Vérification PR develop/homol → main

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-pr-source:
    name: 🔒 Vérification PR develop/homol → Main
    uses: LeZouzouEnWeb/workflows/.github/workflows/check-pr-source.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      source_branch: develop,homol
      target_branch: main
