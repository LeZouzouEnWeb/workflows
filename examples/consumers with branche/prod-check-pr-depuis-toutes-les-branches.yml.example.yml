# Exemple d'utilisation du workflow de vérification PR vers PROD
# Ce workflow autorise toutes les branches source vers main

name: 🔒 Vérification PR toutes branches → main

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-pr-source:
    name: 🔒 Vérification PR toutes branches → Main
    uses: LeZouzouEnWeb/workflows/.github/workflows/check-pr-source.yml@v1.0.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      source_branch: '*'
      target_branch: main
