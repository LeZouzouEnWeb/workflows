name: 🔄 Mettre a jour le titre de la PR

on:
  workflow_call:
    inputs: {}
    secrets: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  update-title-from-branch:
    name: 🔄 Mettre a jour le titre depuis la branche
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Mettre a jour le titre depuis la branche
        uses: actions/github-script@v7

        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("Aucune PR détectée.");
              return;
            }

            const branch = pr.head?.ref || "";
            const origTitle = pr.title || "";
            const body = pr.body || "";

            // -----------------------------------
            // Nettoyage branche
            // -----------------------------------

            const cleanBranch = branch
              .replace(/[-_/]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            // -----------------------------------
            // Si déjà normalisé
            // -----------------------------------

            if (/^\s*\[#\d+\]\s+/i.test(origTitle)) {
              core.info("Titre déjà normalisé.");
              return;
            }

            // -----------------------------------
            // Regex tickets
            // -----------------------------------

            const regexes = [
              /ticket[-_\s]?(\d{1,8})\b/i,
              /#(\d{1,8})\b/i,
              /\b[A-Z][A-Z0-9_]+-(\d{1,8})\b/i,
              /(?:close[sd]?|fix(?:es|ed)?|resolve(?:s|d)?)\s+#(\d{1,8})/i
            ];

            // -----------------------------------
            // Recherche ticket avec priorité
            // -----------------------------------

            function findTicket(text) {
              if (!text) {
                return null;
              }

              for (const regex of regexes) {
                const match = text.match(regex);

                if (match?.[1]) {
                  return match[1];
                }
              }

              return null;
            }

            let num = null;
            let detectedFrom = null;

            // 1️⃣ Branche
            num = findTicket(branch);

            if (num) {
              detectedFrom = "branch";
            }

            // 2️⃣ Titre
            if (!num) {
              num = findTicket(origTitle);

              if (num) {
                detectedFrom = "title";
              }
            }

            // 3️⃣ Body
            if (!num) {
              num = findTicket(body);

              if (num) {
                detectedFrom = "body";
              }
            }

            core.info(`Ticket détecté depuis : ${detectedFrom || "aucun"}`);
            core.info(`Ticket : ${num || "non trouvé"}`);

            // -----------------------------------
            // Préfixe + label
            // -----------------------------------

            let prefix = "";
            let label = cleanBranch;

            if (num) {
              const cleanTicketRe =
                /\b(ticket[-_\s]?\d{1,8}|#\d{1,8}|[A-Z][A-Z0-9_]+-\d{1,8})\b/i;

              const cleanTicketMatch = cleanTicketRe.exec(cleanBranch);

              if (cleanTicketMatch) {
                const before = cleanBranch
                  .slice(0, cleanTicketMatch.index)
                  .trim();

                const after = cleanBranch
                  .slice(
                    cleanTicketMatch.index +
                    cleanTicketMatch[0].length
                  )
                  .trim();

                if (after) {
                  prefix = before;
                  label = after;
                } else if (before) {
                  label = before;
                }
              } else {
                label =
                  cleanBranch.replace(cleanTicketRe, "").trim()
                  || cleanBranch;
              }
            }

            // -----------------------------------
            // Détection préfixe standard
            // -----------------------------------

            if (!prefix) {
              const prefixMatch = label.match(
                /^(feature|fix|hotfix|bugfix|release|chore|task|refactor)\b/i
              );

              if (prefixMatch) {
                prefix = prefixMatch[1].toLowerCase();

                label = label
                  .replace(
                    new RegExp("^" + prefixMatch[0] + "\\b\\s*"),
                    ""
                  )
                  .trim();
              }
            }

            // -----------------------------------
            // Nettoyage final
            // -----------------------------------

            prefix = prefix.replace(/\s+/g, " ").trim();
            label = label.replace(/\s+/g, " ").trim();

            if (!label) {
              label = cleanBranch || branch;
            }

            // -----------------------------------
            // Construction titre
            // -----------------------------------

            const parts = [];

            if (num) {
              parts.push(`[#${num}]`);
            }

            if (prefix) {
              parts.push(prefix);
            }

            if (label) {
              parts.push(label);
            }

            const newTitle = parts
              .join(" - ")
              .replace(/\s+/g, " ")
              .trim();

            // -----------------------------------
            // Mise à jour
            // -----------------------------------

            if (newTitle && newTitle !== origTitle) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: newTitle
              });

              core.info(
                `Titre mis à jour : "${origTitle}" → "${newTitle}"`
              );
            } else {
              core.info("Aucun changement appliqué.");
            }
