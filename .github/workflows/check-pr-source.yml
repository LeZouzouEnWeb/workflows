name: 🔒 Vérification source PR (générique)

on:
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
        description: "Branche(s) source(s) autorisée(s) (ex. develop, develop,homol, ou * pour toutes les branches)"
      target_branch:
        required: true
        type: string
        description: "Branche cible (homol, main, etc.)"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-pr-source:
    name: 🔎 Vérifier la source de la PR
    runs-on: ubuntu-latest

    steps:
      - name: 🔎 Contrôle de la branche source
        id: check
        shell: bash
        run: |
          echo "### Contrôle PR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche source (head): \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche cible (base):  \`${{ github.base_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sources attendues: \`${{ inputs.source_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cible attendue: \`${{ inputs.target_branch }}\`" >> "$GITHUB_STEP_SUMMARY"

          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          TARGET="${{ inputs.target_branch }}"
          RAW_SOURCES="${{ inputs.source_branch }}"
          MATCH=0

          if [ -z "$RAW_SOURCES" ] || [ "$RAW_SOURCES" = "*" ] || [ "$RAW_SOURCES" = "all" ] || [ "$RAW_SOURCES" = "any" ]; then
            MATCH=1
          else
            IFS=',' read -r -a ALLOWED_BRANCHES <<< "$RAW_SOURCES"
            for branch in "${ALLOWED_BRANCHES[@]}"; do
              candidate="$(echo "$branch" | xargs)"
              if [ -n "$candidate" ] && [ "$candidate" = "$HEAD" ]; then
                MATCH=1
                break
              fi
            done
          fi

          if [ "$BASE" = "$TARGET" ] && [ "$MATCH" -eq 0 ]; then
            MSG="🚫 PR refusée : seules les PR provenant de \`${RAW_SOURCES}\` vers \`${TARGET}\` sont autorisées."
            echo "$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          OK="✅ PR valide : $HEAD → $BASE"
          echo "$OK"
          echo "$OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Commenter la PR si invalide
        if: ${{ failure() }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚫 **PR refusée**

            - **Cible** : `${{ github.base_ref }}`
            - **Source** : `${{ github.head_ref }}`

            Seules les PR provenant de **`${{ inputs.source_branch }}`** peuvent être fusionnées dans **`${{ inputs.target_branch }}`**.
            Merci d'ouvrir une PR **${{ inputs.source_branch }} → ${{ inputs.target_branch }}**.
