name: Symfony Controle

on:
  workflow_call:
    inputs:
      php-version:
        required: false
        type: string
        default: '8.4'

      symfony-dir:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Setup PHP
      # ------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}

      # ------------------------------------------------------------
      # Resolve Symfony directory
      # ------------------------------------------------------------
      - name: Resolve Symfony directory
        shell: bash
        run: |
          if [ -n "${{ inputs.symfony-dir }}" ]; then

            if [ ! -d "${{ inputs.symfony-dir }}" ]; then
              echo "Directory not found: ${{ inputs.symfony-dir }}"
              exit 1
            fi

            echo "PROJECT_DIR=${GITHUB_WORKSPACE}/${{ inputs.symfony-dir }}" >> $GITHUB_ENV

          else

            echo "PROJECT_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

          fi

      # ------------------------------------------------------------
      # Copy .env.test.local
      # ------------------------------------------------------------
      - name: Copy .env.test.local
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      # ------------------------------------------------------------
      # Cache Composer
      # ------------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/vendor
          key: ${{ runner.os }}-php-${{ hashFiles(format('{0}/composer.lock', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-php-

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      # ------------------------------------------------------------
      # Create SQLite database
      # ------------------------------------------------------------
      - name: Create SQLite database
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p data
          touch data/database.sqlite

      # ------------------------------------------------------------
      # PHPUnit
      # ------------------------------------------------------------
      - name: Run PHPUnit
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
        run: |
          vendor/bin/phpunit