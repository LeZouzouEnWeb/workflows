name: 🔗 Lier les tickets a la PR

on:
  workflow_call:
    inputs: {}
    secrets: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  link-issues-in-pr:
    name: 🔗 Lier les tickets a la PR
    runs-on: ubuntu-latest

    steps:
      - name: Détecter et lier les tickets dans la PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // -----------------------------
            // Regex
            // -----------------------------

            // ticket-123 / ticket_123 / ticket 123
            const reTicketInBranch = /(?:^|[\/_-])ticket[-_ ]?(\d+)(?=$|[^0-9])/ig;
            const reTicketInText   = /\bticket[-_ ]?(\d+)\b/ig;

            // #123
            const reHashIssue = /#(\d+)\b/g;

            // PROJ-123
            const reProjectIssue = /\b[A-Z][A-Z0-9_]+-(\d+)\b/g;

            // Fixes #123
            const reClosingRef = /(?:close[sd]?|fix(?:es|ed)?|resolve(?:s|d)?)\s+#(\d+)/ig;

            // Verbe fort
            const strongVerbRe = /\b(fix(?:es|ed)?|close(?:s|d)?|resolve(?:s|d)?)\b/i;

            // -----------------------------
            // Sources
            // -----------------------------

            const branch = pr.head.ref || '';
            const title  = pr.title || '';
            let body     = pr.body || '';

            // Commits PR
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const commitMessages = commits
              .map(c => c.commit.message)
              .join('\n');

            console.log(`PR #${pr.number}`);
            console.log(`BRANCH="${branch}"`);
            console.log(`TITLE="${title}"`);

            // -----------------------------
            // Fonction de détection
            // -----------------------------

            function extractNumbers(text, includeBranchRegex = false) {
              const found = new Set();

              if (!text) {
                return found;
              }

              // ticket-123
              const regexes = [
                reTicketInText,
                reHashIssue,
                reProjectIssue,
                reClosingRef
              ];

              if (includeBranchRegex) {
                regexes.unshift(reTicketInBranch);
              }

              for (const regex of regexes) {
                regex.lastIndex = 0;

                for (const match of text.matchAll(regex)) {
                  const n = Number(match[1]);

                  if (Number.isInteger(n)) {
                    found.add(n);
                  }
                }
              }

              return found;
            }

            // -----------------------------
            // Priorité de recherche
            // -----------------------------

            let found = new Set();
            let detectedFrom = '';

            // 1. Branche
            found = extractNumbers(branch, true);

            if (found.size > 0) {
              detectedFrom = 'branch';
            }

            // 2. Titre
            if (found.size === 0) {
              found = extractNumbers(title);

              if (found.size > 0) {
                detectedFrom = 'title';
              }
            }

            // 3. Body
            if (found.size === 0) {
              found = extractNumbers(body);

              if (found.size > 0) {
                detectedFrom = 'body';
              }
            }

            // 4. Commits
            if (found.size === 0) {
              found = extractNumbers(commitMessages);

              if (found.size > 0) {
                detectedFrom = 'commits';
              }
            }

            console.log(`Détection depuis : ${detectedFrom}`);
            console.log('NUMÉROS détectés:', [...found]);

            // -----------------------------
            // Aucun ticket trouvé
            // -----------------------------

            if (found.size === 0) {
              core.setFailed(
                'Cette PR n’est liée à aucun ticket/issue détecté.\n' +
                'Formats acceptés :\n' +
                '- Closes #123\n' +
                '- ticket-123\n' +
                '- PROJ-123\n' +
                '- #123'
              );

              return;
            }

            // -----------------------------
            // Détection Fixes/Related
            // -----------------------------

            const haystack = [
              branch,
              title,
              body,
              commitMessages
            ].join('\n');

            const useFixes = strongVerbRe.test(haystack);

            // -----------------------------
            // Éviter les doublons
            // -----------------------------

            const already = new Set();
            const bodyLower = body.toLowerCase();

            for (const n of found) {
              if (bodyLower.includes(`#${n}`)) {
                already.add(n);
              }
            }

            const toAdd = [...found].filter(n => !already.has(n));

            if (toAdd.length === 0) {
              console.log('Tous les tickets détectés sont déjà référencés.');
              return;
            }

            // -----------------------------
            // Mise à jour PR
            // -----------------------------

            const prefix = useFixes ? 'Fixes' : 'Related to';

            const lines = toAdd
              .map(n => `${prefix} #${n}`)
              .join('\n');

            const separator = body.trim().length ? '\n\n' : '';

            const newBody =
              `${body}${separator}` +
              `<!-- auto-linked by workflow -->\n` +
              `${lines}\n`;

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              body: newBody
            });

            console.log(`Ajouté dans la PR:\n${lines}`);
